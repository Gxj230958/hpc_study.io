name: Tutorial Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs-and-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu --group browser
      - run: uv run --no-sync python scripts/check-labs.py --final
      - run: uv run --no-sync python -m unittest discover -s tests
      - run: uv run --no-sync python scripts/course.py --check
      - run: uv run --no-sync python scripts/validate.py
      - run: uv run --no-sync python scripts/run-labs.py --output build/labs-cpu
      - run: uv run --no-sync python scripts/build-site.py
      - run: uv run --no-sync playwright install --with-deps chromium
      - name: Browser checks
        run: |
          uv run --no-sync python scripts/serve-site.py --port 8008 > build/preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          uv run --no-sync python scripts/browser-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-validation
          path: |
            build/validation
            build/labs-cpu
            build/browser-english

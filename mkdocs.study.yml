site_name: HPC Study
site_description: An English course in CPU, GPU and distributed computing
site_url: https://gxj230958.github.io/hpc_study.io/
repo_name: Gxj230958/hpc_study.io
repo_url: https://github.com/Gxj230958/hpc_study.io
edit_uri: edit/main/docs/en/docs/
docs_dir: docs/en/docs
site_dir: site
copyright: Based on HPC Wiki Team and contributors. CC BY-NC-SA 4.0.
theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: en
  - redirects:
      redirect_maps: {}
markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ''
  - pymdownx.tabbed:
      alternate_style: true
extra:
  generator: false
  alternate:
    - name: English
      link: /hpc_study.io/
      lang: en
    - name: Chinese archive
      link: /hpc_study.io/archive/zh/
      lang: zh
extra_css:
  - static/css/study.css
  - static/css/course.css
extra_javascript:
  - static/vendor/mathjax/tex-mml-chtml.js
  - static/vendor/mermaid.min.js
  - static/js/study.js
hooks:
  - scripts/study-hooks.py
  - scripts/shared-assets.py
nav:
  - Start Here:
      - HPC Study: index.md
      - Course map: learning/path.md
      - Setup: learning/setup.md
      - Experiments: learning/labs.md
      - Validation: learning/validation.md
  - CPU and Memory:
      - Machine fundamentals: hardware/hardware-intro.md
      - Processors: hardware/processor.md
      - Memory: hardware/memory.md
      - CPU parallelism: parallel-programming/parallel-programming-intro.md
      - Processes and threads: thread-process/intro.md
      - Processes: thread-process/process.md
      - Threads: thread-process/thread.md
      - Task granularity: thread-process/more.md
      - OpenMP: parallel-programming/openmp.md
      - Memory model: memory-model/intro.md
      - Consistency: memory-model/consistency.md
      - Caches: memory-model/cache.md
      - NUMA: memory-model/numa.md
      - MPI and networking: parallel-programming/mpi.md
      - mpi4py: parallel-programming/mpi4py.md
      - Communication: communication/intro.md
      - Message models: communication/model.md
      - Communication cost: communication/cost.md
      - Deadlock: communication/deadlock.md
  - GPU Programming:
      - CUDA programming: gpu/intro.md
      - Architecture: gpu/arch.md
      - CUDA kernels: gpu/cuda.md
      - Tiling and reduction: gpu/cuda-advanced.md
      - Nsight Systems: gpu/nsys.md
      - NCCL: gpu/nccl.md
  - Performance and Applications:
      - Measurement and benchmarks: performance-analysis/intro.md
      - Profiling tools: performance-analysis/tools.md
      - Benchmark design: benchmark/intro.md
      - HPL: benchmark/hpl.md
      - HPCG: benchmark/hpcg.md
      - MLPerf: benchmark/mlperf.md
      - Scientific computing and ML: sci-mlsys/intro.md
      - Sparse solving: sci-mlsys/sparsity.md
      - Quantization: sci-mlsys/quantization.md
      - Training parallelism: sci-mlsys/parallelism.md
  - Clusters:
      - Distributed GPUs and clusters: clusters/platform-intro.md
      - Cluster operation: clusters/cluster.md
      - Distributed experiments: clusters/distributed.md
      - Software modules: clusters/modules.md
      - Scheduling: clusters/scheduling.md
      - Allocated cloud instances: clusters/cloud.md
  - Datacenter GPUs:
      - Datacenter GPU study: datacenter/intro.md
      - Architecture variants: datacenter/architectures.md
      - Memory and roofline: datacenter/roofline.md
      - Precision and porting: datacenter/porting.md
      - Fabrics and MIG: datacenter/topology.md
      - Scheduling and cost: datacenter/operations.md
  - Reference:
